name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The dataset is committed, so the tests are what keep it honest.
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # One step, because each `run:` gets its own shell — a server backgrounded
      # in one step is gone by the next.
      #
      # verify runs before audit: if the bundle 404s the page is blank, and a
      # blank page still measures as 100% width use. Ask what rendered before
      # measuring how wide it is.
      - name: Verify the built site
        run: |
          npx vite preview --port 5177 --strictPort &
          npx wait-on http://localhost:5177/nightreign-cheatsheet/ -t 60000
          node tools/verify.mjs http://localhost:5177/nightreign-cheatsheet
          node tools/audit.mjs http://localhost:5177/nightreign-cheatsheet
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
