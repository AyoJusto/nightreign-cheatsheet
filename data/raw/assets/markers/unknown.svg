<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Drawn for Bonfire Buddy (no game asset exists on the wiki): an unexplored site as the game marks it, a soft
       gold flame-glow with a thin "?" in it. No rim, no bevel: light only. The bright core is about half the box. -->
  <defs>
    <radialGradient id="halo" cx="50%" cy="54%" r="50%">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.8"/>
      <stop offset="0.5" stop-color="#eaa43a" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#d98f28" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fffbea"/>
      <stop offset="0.4" stop-color="#ffe29a" stop-opacity="0.95"/>
      <stop offset="0.8" stop-color="#f0b246" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#e09a30" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fff3c8"/>
      <stop offset="0.5" stop-color="#ffc85e" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f0a238" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.6"/></filter>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <circle cx="64" cy="68" r="60" fill="url(#halo)"/>
  <!-- Flame tongues licking up out of the glow, softened so they read as light rather than shapes. -->
  <g fill="url(#flame)" filter="url(#soft)">
    <path d="M64 96 C40 92 34 68 44 46 C47 58 53 62 56 56 C55 42 60 28 70 16 C67 34 80 40 80 56 C84 50 87 44 86 36 C98 56 94 90 64 96 Z"/>
    <path d="M42 90 C28 80 28 62 34 52 C37 64 42 70 48 74 Z" opacity="0.8"/>
    <path d="M86 90 C100 80 100 64 95 54 C92 64 88 70 80 74 Z" opacity="0.8"/>
  </g>
  <circle cx="64" cy="70" r="30" fill="url(#core)" filter="url(#blur)"/>
  <!-- The "?": a thin pale stroke over a soft dark shadow, so it reads on the light. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M54 60c0-6.4 4.5-10.6 10.2-10.6S74 53.2 74 58.5c0 4.6-3.1 6.7-6 8.6-2.7 1.8-3.8 3.4-3.8 7" stroke="#5a3004" stroke-opacity="0.7" stroke-width="9" filter="url(#soft)"/>
    <path d="M54 60c0-6.4 4.5-10.6 10.2-10.6S74 53.2 74 58.5c0 4.6-3.1 6.7-6 8.6-2.7 1.8-3.8 3.4-3.8 7" stroke="#fffaf0" stroke-width="4.6"/>
  </g>
  <circle cx="64.2" cy="83.5" r="5" fill="#5a3004" fill-opacity="0.7" filter="url(#soft)"/>
  <circle cx="64.2" cy="83.5" r="3.1" fill="#fffaf0"/>
</svg>
