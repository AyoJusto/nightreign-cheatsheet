<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Drawn for Bonfire Buddy (no game asset exists on the wiki): the player's position as a pale spirit-flame arrowhead in a bronze ring. -->
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0.4" stop-color="#8ff3e6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#3fd0c0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9fe9df"/>
    </linearGradient>
  </defs>
  <circle cx="64" cy="64" r="62" fill="url(#halo)"/>
  <circle cx="64" cy="64" r="33" fill="#0e1628" fill-opacity="0.85" stroke="#c9a55c" stroke-width="4"/>
  <circle cx="64" cy="64" r="27.5" fill="none" stroke="#7a5a2e" stroke-width="1.5"/>
  <path d="M64 40 L80 82 L64 73 L48 82 Z" fill="url(#arrow)" stroke="#0b3b36" stroke-width="2.5" stroke-linejoin="round"/>
</svg>
